name: HelloFace Windows Preview Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup and FFmpeg
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          choco install ffmpeg --yes --no-progress
      - name: Configure CMake
        run: cmake -S . -B build -A x64 -DHELLOFACE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage application for installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Filter HelloFace.exe -File -Recurse | Select-Object -First 1
          if (!$exe) {
            Get-ChildItem build -Recurse | Select-Object FullName
            throw "CMake did not produce HelloFace.exe"
          }
          New-Item -ItemType Directory -Force dist\app | Out-Null
          Copy-Item $exe.FullName dist\app\HelloFace.exe
          Write-Host "Staged $($exe.FullName)"
      - name: Package Setup.exe
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if (!(Test-Path "dist/HelloFace-Setup.exe")) { throw "Installer was not generated" }
      - name: Render explainer MP4
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/render_explainer.py
          if (!(Test-Path "dist/HelloFace-Explainer.mp4")) { throw "Video was not generated" }
      - name: Upload preview downloads
        uses: actions/upload-artifact@v4
        with:
          name: HelloFace-Windows-Preview
          path: |
            dist/HelloFace-Setup.exe
            dist/HelloFace-Explainer.mp4
          if-no-files-found: error
          retention-days: 30
      - name: Publish preview release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-preview
          target_commitish: ${{ github.sha }}
          name: HelloFace v0.1.0 Preview
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            ## HelloFace Windows Preview

            This preview package contains:
            - **HelloFace-Setup.exe** — installs the current HelloFace dashboard preview.
            - **HelloFace-Explainer.mp4** — short explainer video.

            ### Important
            This is an engineering preview, not a working Windows facial-login provider. Camera enrollment, live face matching, anti-spoofing, and Windows sign-in integration are not implemented. Keep Windows PIN/password sign-in enabled.

            Built and tested by the HelloFace Windows CI workflow.
          files: |
            dist/HelloFace-Setup.exe
            dist/HelloFace-Explainer.mp4
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HelloFace-Setup.exe
            dist/HelloFace-Explainer.mp4
          generate_release_notes: true
