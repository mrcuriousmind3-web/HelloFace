name: Publish HelloFace Preview Release

on:
  workflow_run:
    workflows: ["HelloFace Windows Preview Build"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Windows preview artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: HelloFace-Windows-Preview
          path: release-assets

      - name: Publish or update preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-preview
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: HelloFace v0.1.0 Preview
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            ## HelloFace Windows Preview

            This preview package contains:
            - **HelloFace-Setup.exe** — installs the current HelloFace dashboard preview.
            - **HelloFace-Explainer.mp4** — short explainer video.

            ### Important
            This is an engineering preview, not a working Windows facial-login provider. Camera enrollment, live face matching, anti-spoofing, and Windows sign-in integration are not implemented. Keep Windows PIN/password sign-in enabled.

            Built and tested by the HelloFace Windows CI workflow.
          files: |
            release-assets/HelloFace-Setup.exe
            release-assets/HelloFace-Explainer.mp4
